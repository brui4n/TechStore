version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: techstore-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: techstore
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./TechStore-backend
      dockerfile: Dockerfile
    container_name: techstore-backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=techstore
      - DB_PORT=3306
      - PORT=3000
      - JWT_SECRET=techstore_super_secret_key_2026
    depends_on:
      - db
    volumes:
      - ./TechStore-backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./TechStore-frontend
      dockerfile: Dockerfile
    container_name: techstore-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    volumes:
      - ./TechStore-frontend:/app
      - /app/node_modules

volumes:
  db_data:
